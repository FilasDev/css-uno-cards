<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uno Playing Cards</title>
  <link rel='stylesheet' href='styles.css'>

</head>

<body>
  <main id='playing-cards'>
    <div class='card'>
      <div class='left'>2</div>
      <div class='middle'>2</div>
      <div class='right'>2</div>
    </div>
    <div class='card red skip'>
      <div class='left'></div>
      <div class='middle'></div>
      <div class='right'></div>
    </div>
    <div class='card yellow reverse'>
      <div class='left'></div>
      <div class='middle'></div>
      <div class='right'></div>
    </div>
    <div class='card blue plus2'>
      <div class='left'>2</div>
      <div class='middle'></div>
      <div class='right'>2</div>
    </div>
    <div class='card plus4'>
      <div class='left'>4</div>
      <div class='middle'></div>
      <div class='right'>4</div>
    </div>
    <div class='card wild'>
      <div class='left'></div>
      <div class='middle'></div>
      <div class='right'></div>
    </div>
  </main>
</body>

</html>
